---
name: charmed-kafka  # the name of your ROCK
base: ubuntu@24.04  # the base environment for this ROCK
version: '4.2.0'  # just for humans. Semantic versioning is recommended
summary: Charmed Kafka ROCK OCI  # 79 char long summary
description: |
  This is an OCI image that bundles Apache Kafka together with other tools
  of its ecosystem in order to be used in Charmed Operators, providing
  automated operations management from day 0 to day 2 on the Apache Kafka
  distributed coodrdinator, on top of a Virtual Machine cluster and K8s cluster.
  It is an open source, end-to-end, production ready data platform on top of
  cloud native technologies.
license: Apache-2.0

platforms:
  amd64:
  arm64:

run_user: _daemon_

environment:
  JAVA_HOME: /usr/lib/jvm/java-21-openjdk-${CRAFT_ARCH_BUILD_FOR}

services:
  kafka:
    override: replace
    command: /opt/kafka/bin/kafka-server-start.sh /etc/kafka/server.properties
    startup: enabled
    environment:
      KAFKA_OPTS: "-javaagent:/opt/kafka/libs/jmx_prometheus_javaagent.jar=\n
        9101:/etc/kafka/jmx_prometheus.yaml\n
        -Djava.security.auth.login.config=\n
        /etc/kafka/kafka-jaas.cfg"

parts:
  kafka:
    plugin: nil
    stage-packages:
      - openjdk-21-jre-headless
      - libpsl5
      - curl
    build-environment:
      - JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      - SNAP_REVISION: 69
    override-build: |
      snap download charmed-kafka --revision "$SNAP_REVISION"
      unsquashfs "charmed-kafka_${SNAP_REVISION}.snap"

      # Python exporter fixes, not present in 4.2
      # rm -rf squashfs-root/bin  # Python binaries are not required
      # mkdir -p squashfs-root/opt/python-exporter
      # # to avoid lib conflicts
      # mv squashfs-root/lib squashfs-root/opt/python-exporter/lib
      # mv squashfs-root/lib64 squashfs-root/opt/python-exporter/lib64

      ln -s $JAVA_HOME/bin/java \
        $CRAFT_PART_INSTALL/usr/bin/java
      ln -s $JAVA_HOME/bin/keytool \
        $CRAFT_PART_INSTALL/usr/bin/keytool

      # making core dirs
      mkdir -p $CRAFT_PART_INSTALL/var/lib/pebble/default/
      mkdir -p $CRAFT_PART_INSTALL/var/lib/kafka/
      mkdir -p $CRAFT_PART_INSTALL/opt/kafka/
      mkdir -p $CRAFT_PART_INSTALL/etc/kafka/
      mkdir -p $CRAFT_PART_INSTALL/etc/connect/
      mkdir -p $CRAFT_PART_INSTALL/etc/cruise-control/
      mkdir -p $CRAFT_PART_INSTALL/var/log/kafka/
      mkdir -p $CRAFT_PART_INSTALL/var/log/connect/
      mkdir -p $CRAFT_PART_INSTALL/var/log/cruise-control/
    organize:
      /root/parts/kafka/build/squashfs-root: /
  non-root-user:
    plugin: nil
    after: [kafka]
    override-prime: |
      KAFKA_GID=584792
      KAFKA_UID=584792

      craftctl default

      # Own and restrict the application and config directories
      for dir in \
        opt/kafka \
        etc/kafka \
        etc/connect \
        etc/cruise-control ;do
          chown -R ${KAFKA_UID}:${KAFKA_GID} ${dir}
          chmod -R 750 ${dir}
      done

      # Create data and log directories owned by the runtime user
      install -d -o ${KAFKA_UID} -g ${KAFKA_GID} -m 770 \
        var/lib/kafka \
        var/log/kafka \
        var/log/connect \
        var/log/cruise-control
