[tox]
requires =
  tox>=4
env_list = lint, integration

[testenv]
setenv =
  version=4.3.0
  repo=https://github.com/canonical/kafka-k8s-operator.git
  base-name=ghcr.io/canonical/charmed-kafka
  risk=edge

[testenv:lint]
description = run linters
skip_install = true
deps =
  yamllint
commands =
  yamllint --no-warnings \
    -d "{extends: relaxed, rules: {line-length: {max: 150}}}" \
    rockcraft.yaml

[testenv:integration]
description = run operator integration tests
skip_install = true
allowlist_externals =
  tox
  microk8s
  bash
commands =
  bash -ec 'if ! [ -f charmed-kafka_$(yq .version rockcraft.yaml)*.rock ]; then rockcraft pack; fi' {posargs}
  microk8s ctr image import charmed-kafka_$(yq .version rockcraft.yaml)*.rock --base-name {env:base-name}:$(yq .version rockcraft.yaml)-$(yq .base rockcraft.yaml | cut -d : -f 2)_{env:risk}
  bash -ec 'if ! [ -d operator ]; then git clone {env:repo} operator ; fi' {posargs}
  tox --workdir operator -c operator -e integration
